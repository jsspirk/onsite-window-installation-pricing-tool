    </div>
    <div style="font-size:12px;color:var(--text-3);margin-top:10px;">Crew-hour rates (not per-person).</div>
  </div>
  ${renderCatalogSaveBar()}

  <div class="section-label mb-8">Default Supplier</div>
  <div style="font-size:13px;color:var(--text-2);margin-bottom:10px;">All new quotes will be priced against this supplier's rate sheet. Existing quotes are unaffected.</div>
  <div class="chip-group mb-16">
    ${SUPPLIER_OPTS.map(s=>`<div class="chip ${defaultSupplier===s.id?'active':''}" data-admin-supplier="${s.id}">${s.name}</div>`).join('')}
  </div>

  <div class="section-label mb-8">Quote Range Band</div>
  <div style="font-size:13px;color:var(--text-2);margin-bottom:10px;">Controls the ± spread shown to customers.</div>
  <div class="chip-group mb-16">
    ${BAND_OPTS.map(b=>`<div class="chip ${rangeBand===b.id?'active':''}" data-admin-band="${b.id}">${b.label}</div>`).join('')}
  </div>

  <div class="section-label mb-8">Minimum Job Cost</div>
  <div style="font-size:13px;color:var(--text-2);margin-bottom:10px;">Hard floor on the low end of every quote range — no bid goes below this, regardless of price or band.</div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
    <span style="font-size:20px;font-weight:700;color:var(--amber);">$</span>
    <input id="admin-min-job-cost" type="number" min="0" step="25"
      value="${minJobCost}"
      style="width:110px;padding:8px 10px;font-size:20px;font-family:var(--font-title);font-weight:800;color:var(--amber);background:var(--bg-1);border:1.5px solid var(--border-0);border-radius:var(--radius-md);text-align:center;" />
    <span style="font-size:13px;color:var(--text-3);">minimum, applied to all jobs</span>
  </div>

  <div class="section-label mb-8">Customer Range Rounding</div>
  <div style="font-size:13px;color:var(--text-2);margin-bottom:10px;">Customer-facing estimate range is floored to the nearest increment on both ends.</div>
  <div class="chip-group mb-16">
    ${ROUND_OPTS.map(r=>`<div class="chip ${roundIncrement===r.id?'active':''}" data-admin-round="${r.id}">${r.label}</div>`).join('')}
  </div>

  ${renderAdminPricingTiers()}
</div>`;
}

function renderAdminMaterials() {
  const catalog     = getDraftCatalog();
  const shapeLabel  = id => id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const smallInput  = 'width:70px;height:34px;padding:0 8px;background:var(--bg-1);border:1.5px solid var(--border-0);border-radius:8px;color:var(--amber);font-family:var(--font-title);font-weight:700;font-size:14px;text-align:right;';
  const thicknesses = ['1/8"','3/16"','1/4"'];
  const weightUnits = [
    { id:'sp', label:'Single Pane' },
    { id:'ig', label:'IG Unit (2 lite)' },
    { id:'tp', label:'Triple Pane (3 lite)' },
  ];
  const thresholdInputStyle = 'width:100px;height:44px;padding:0 10px;background:var(--bg-1);border:1.5px solid var(--border-0);border-radius:var(--radius-md);color:var(--amber);font-family:var(--font-title);font-weight:800;font-size:20px;text-align:center;';
  return `
<div>
  <div class="section-label mb-12">Shape Multipliers</div>
  <div class="card mb-16" style="padding:0;overflow:hidden;">
    <table class="admin-table" style="width:100%;">
      <thead><tr><th>Shape</th><th style="text-align:right;">Multiplier</th></tr></thead>
      <tbody>
        ${Object.entries(catalog.shapeMultipliers).map(([id, mult]) => `
        <tr>
          <td style="font-weight:600;">${shapeLabel(id)}</td>
          <td style="text-align:right;"><input data-catalog-shape="${id}" type="number" step="0.05" min="0.01" value="${mult}" style="${smallInput}" /></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  <div class="section-label mb-12">Glass Weights (lbs/SF)</div>
  <div class="card mb-16" style="padding:0;overflow:hidden;">
    <table class="admin-table" style="width:100%;">
      <thead><tr><th>Unit Type</th>${thicknesses.map(t=>`<th style="text-align:right;">${t}</th>`).join('')}</tr></thead>
      <tbody>
        ${weightUnits.map(u => `
        <tr>
          <td style="font-weight:600;">${u.label}</td>
          ${thicknesses.map(t => `<td style="text-align:right;"><input data-catalog-weight-unit="${u.id}" data-catalog-weight-thickness="${t.replace(/"/g,'&quot;')}" type="number" step="0.01" min="0" value="${catalog.glassWeights[u.id]?.[t] ?? ''}" style="${smallInput}" /></td>`).join('')}
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  <div class="section-label mb-12">Heavy-Lift Thresholds</div>
  <div class="card mb-16">
    <div style="display:flex;gap:24px;align-items:flex-end;">
      <div>
        <div style="font-size:12px;color:var(--text-2);margin-bottom:4px;">2-Tech at any floor (lbs)</div>
        <input data-catalog-threshold="heavy" type="number" step="1" min="1" value="${catalog.weightThresholds.heavy}" style="${thresholdInputStyle}" />
      </div>
      <div>
        <div style="font-size:12px;color:var(--text-2);margin-bottom:4px;">2-Tech if upper floor (lbs)</div>
        <input data-catalog-threshold="elevated" type="number" step="1" min="1" value="${catalog.weightThresholds.elevated}" style="${thresholdInputStyle}" />
      </div>
    </div>
  </div>

  ${renderCatalogSaveBar()}

  <div class="card mt-12" style="background:var(--bg-2);">
    <div class="section-label mb-8">Pricing Formula Reference</div>
    <div style="font-size:13px;color:var(--text-2);line-height:2.0;font-family:monospace;">
      <div>SF = (width × height) / 144</div>
      <div>glassCost = SF × (rawRate + gridAdder) × shapeMult × supplierMarkup</div>
      <div>paneTotal = glassCost × tierMultiplier(glassCost) + laborHrs × laborRate</div>
      <div>tierMultiplier looked up from the Pricing Tiers set on the Labor &amp; Pricing tab</div>
      <div>laborRate = $${catalog.laborRates[1]}/hr (1-tech) or $${catalog.laborRates[2]}/hr (2-tech crew)</div>
      <div>range = paneTotal × (1 ± band), floor $${appConfig.min_job_cost ?? 400}</div>
    </div>
  </div>
</div>`;
}

function renderAdminPricingTiers() {
  const tiers = app.draftTiers || appConfig.markup_tiers || DEFAULT_MARKUP_TIERS;
  return `
<div>
  <div class="section-label mb-8">Pricing Tiers</div>
  <div style="font-size:13px;color:var(--text-2);margin-bottom:12px;">Glass sell price = supplier cost × the multiplier for the tier its raw cost falls into. Tiers are checked in ascending order of max cost; the last tier always catches everything above it.</div>

  ${tiers.map((t, i) => `
  <div class="card card-tight mb-8" data-tier-id="${t.id}">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      <div style="flex:2;min-width:110px;">

function openAdminQuote(quoteId) {
  const q = appData.quotes.find(x => x.id === quoteId);

  app.draft = {
    id:              q.id,
    customerName:    q.customerName || '',
    customerContact: q.customerContact || '',
    contactType:     q.contactType || 'phone',
    jobDate:         q.jobDate,
    jobNum:          q.jobNum || '',
    notes:           q.notes || '',
    toolsRequired:   q.toolsRequired || '',
    supplier:        q.supplier || getDefaultSupplier(),
    panes:           JSON.parse(JSON.stringify(q.panes)),
    currentPane:     freshPane(),
    editingPaneIdx:  null,
    step:            3,
    catalogVersion:  q.catalogVersion,
    status:          q.status,
    techId:          q.techId,
    techName:        q.techName,
    isAdminEdit:     true,
  };
  navigate('quote-detail');
}

/* ================================================================
   SCREEN: PRESENTATION PRICE
   Gates every path to the customer view — a price gets picked once,
   here, and reused everywhere after (Customer View, re-opens, re-sends).
================================================================ */
function renderPresentPrice() {
  const d = app.draft;
  if (!d) return '';
  const jobCalc = calcJob(d.panes, d.supplier, { rounded: true });
  const inc = appConfig.round_increment || 25;
  const { low, high } = rangeBounds(jobCalc.grandTotal);
  const incLow  = roundToIncrement(low, inc);
  const incHigh = roundToIncrement(high, inc);
  const mid     = roundToIncrement((low + high) / 2, inc);
  if (d.pendingPresentPrice === undefined || d.pendingPresentPrice === null) {
    d.pendingPresentPrice = d.agreedPrice ?? mid;
  }
  const price = d.pendingPresentPrice;

  return `

function attachSignatureEvents() {
  const backBtn = document.getElementById('sig-back-btn');
  if (backBtn) backBtn.addEventListener('click', () => {
    app.signatureOpen = false;
    render();
  });

  const checkbox = document.getElementById('sig-checkbox');
  if (checkbox) checkbox.addEventListener('change', e => {
    app.signatureCheckbox = e.target.checked;
    updateSignatureSubmitState();
  });

  const canvas = document.getElementById('signature-canvas');
  let ctx = null, drawing = false, last = null;
  if (canvas) {
    ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const pos = e => {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height),
      };
    };
    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      drawing = true;
      last = pos(e);
      app.signatureHasStrokes = true;
      updateSignatureSubmitState();
    });
    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
    });
    const stop = () => { drawing = false; };
    canvas.addEventListener('pointerup', stop);
    canvas.addEventListener('pointerleave', stop);
    canvas.addEventListener('pointercancel', stop);
  }

  const clearBtn = document.getElementById('sig-clear-btn');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
    app.signatureHasStrokes = false;
    updateSignatureSubmitState();
  });

  const submitBtn = document.getElementById('sig-submit-btn');
  if (submitBtn) submitBtn.addEventListener('click', () => {
    if (!app.signatureCheckbox || !app.signatureHasStrokes || !canvas) return;
    const dataUrl = canvas.toDataURL('image/png');
    const d = app.draft;
    d.customerApproved = true;
    d.approvedAt = new Date().toISOString();
    app.signatureOpen = false;
    app.customerViewOpen = false;
    app.customerViewQuoteId = null;
    app.pendingSaveAsShown = false;
    completeSendAction('approved', dataUrl);
  });
}

function updateSignatureSubmitState() {
  const btn = document.getElementById('sig-submit-btn');
  if (!btn) return;
  const can = !!(app.signatureCheckbox && app.signatureHasStrokes);
  btn.disabled = !can;
  btn.style.opacity = can ? '1' : '0.4';
  btn.style.cursor = can ? 'pointer' : 'not-allowed';
}

/* ================================================================
   EVENT HANDLERS
================================================================ */
function attachEvents() {
  const on = (id, ev, fn) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener(ev, fn);
  };
  const delegate = (selector, ev, fn) => {
    document.querySelectorAll(selector).forEach(el => el.addEventListener(ev, fn));
  };
  // render() does a full innerHTML replace, which destroys and recreates
  // the input element — a plain `render()` on every keystroke would drop
  // focus after each character, forcing a re-click to type the next one.
  // Re-focus and restore the exact cursor position (not just append-to-end,
  // so editing mid-string doesn't jump the cursor) right after re-render.
  const onSearchInput = (id, stateSetter) => {
    on(id, 'input', e => {
      const cursorPos = e.target.selectionStart;
      stateSetter(e.target.value);
      render();
      const el = document.getElementById(id);
      if (el) { el.focus(); el.setSelectionRange(cursorPos, cursorPos); }
    });
  };

  // ---- THEME ----
  delegate('[data-theme-toggle]', 'click', toggleTheme);

  // ---- LOGIN ----
  on('login-btn', 'click', handleLogin);
  on('login-pass', 'keydown', e => { if (e.key === 'Enter') handleLogin(); });
  on('login-user', 'keydown', e => { if (e.key === 'Enter') document.getElementById('login-pass')?.focus(); });
  on('forgot-password-link', 'click', () => {
    app.forgotPasswordSent = false;
    navigate('forgot-password');
  });

  // ---- FORGOT / RESET PASSWORD ----
  on('back-to-login-btn', 'click', () => {
    app.loginError = '';
    app.forgotPasswordSent = false;
    navigate('login');
  });
  on('send-reset-btn', 'click', async () => {
    const email = document.getElementById('forgot-email')?.value.trim();
    const errEl = document.getElementById('forgot-error');
    if (!email) { if (errEl) errEl.textContent = 'Please enter your email.'; return; }
    const btn = document.getElementById('send-reset-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
    const redirectTo = window.location.origin + window.location.pathname;
    await sb.auth.resetPasswordForEmail(email, { redirectTo });
    app.forgotPasswordSent = true;
    render();
  });
  on('set-new-password-btn', 'click', async () => {
    const pw = document.getElementById('new-password')?.value || '';
    const pwConfirm = document.getElementById('new-password-confirm')?.value || '';
    const errEl = document.getElementById('new-password-error');
    if (pw.length < 8) { if (errEl) errEl.textContent = 'Password must be at least 8 characters.'; return; }
    if (pw !== pwConfirm) { if (errEl) errEl.textContent = 'Passwords do not match.'; return; }
    const btn = document.getElementById('set-new-password-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) {
      if (errEl) errEl.textContent = 'Could not update password. Request a new reset link and try again.';
      if (btn) { btn.disabled = false; btn.textContent = 'Set New Password'; }
      return;
    }
    app.passwordUpdated = true;
    render();
  });
  on('new-password-continue-btn', 'click', async () => {
    app.passwordUpdated = false;
    await sb.auth.signOut();
    navigate('login');
  });

  // ---- HOME ----
  on('start-new-quote', 'click', () => {
    app.draft = newDraft();
    navigate('new-quote');
  });
  delegate('[data-nav-logout]', 'click', async () => {
    await sb.auth.signOut();
    app.currentUser = null;
    app.draft = null;
    navigate('login');
  });
  on('home-admin-btn', 'click', () => navigate('admin'));
  on('home-admin-btn2', 'click', () => navigate('admin'));
  on('view-all-history', 'click', () => navigate('history'));

  // History items — both admin and tech go to quote-detail
  delegate('[data-quote-id]', 'click', e => {
    viewQuoteFromHistory(e.currentTarget.dataset.quoteId);
  });

  // ---- NEW QUOTE STEP 1 ----
  on('back-home', 'click', () => {
    if (hasUnsavedRisk() && !confirm('Discard this quote? Nothing has been saved yet.')) return;
    app.draft = null;
    navigate('home');
  });

  // Debounced autosave for customer-info fields — a pane action has already
  // synced the draft by the time these matter, so this only fires once
  // there's something worth attaching the info to.
  const debouncedCustomerAutosave = () => {
    const d = app.draft;
    if (!d || d.isAdminEdit || d.panes.length === 0) return;
    clearTimeout(app._customerAutosaveTimer);
    app._customerAutosaveTimer = setTimeout(() => autosaveDraft(d), 600);
  };

  // Job-level inputs
  on('cust-name',         'input',  e => { app.draft.customerName    = e.target.value; debouncedCustomerAutosave(); });
  on('cust-contact',      'input',  e => { app.draft.customerContact = e.target.value; debouncedCustomerAutosave(); });
  on('cust-contact-type', 'change', e => { app.draft.contactType     = e.target.value; debouncedCustomerAutosave(); });
  on('job-num',           'input',  e => { app.draft.jobNum          = e.target.value; debouncedCustomerAutosave(); });

  // Deferred render for price preview — fires only after the user has stopped interacting
  const deferredRender = () => {
    clearTimeout(app._renderTimer);
    app._renderTimer = setTimeout(() => render(), 600);
  };

  on('pane-location', 'input', e => { app.draft.currentPane.location = e.target.value; });

  // Dimension entry — whole number inputs
  // State update on every keystroke; render deferred to change event (blur/Enter)
  on('pane-width-whole', 'input', e => {
    const cp = app.draft.currentPane;
    cp.widthWhole = e.target.value;
    cp.width = resolveInches(cp.widthWhole, cp.widthFrac);
    updateFracChipsEnabled('width', !!cp.widthWhole);
  });
  on('pane-width-whole', 'change', e => {
    const cp = app.draft.currentPane;
    cp.widthWhole = e.target.value;
    cp.width = resolveInches(cp.widthWhole, cp.widthFrac);
    deferredRender();
  });
  on('pane-height-whole', 'input', e => {
    const cp = app.draft.currentPane;
    cp.heightWhole = e.target.value;
    cp.height = resolveInches(cp.heightWhole, cp.heightFrac);
    updateFracChipsEnabled('height', !!cp.heightWhole);
  });
  on('pane-height-whole', 'change', e => {
    const cp = app.draft.currentPane;
    cp.heightWhole = e.target.value;
    cp.height = resolveInches(cp.heightWhole, cp.heightFrac);
    deferredRender();
  });

  // Fraction chips — only fire if whole number is present (chips disabled via CSS otherwise)
  delegate('[data-dim][data-frac]', 'click', e => {
    const cp  = app.draft.currentPane;
    const dim  = e.currentTarget.dataset.dim;
    const frac = e.currentTarget.dataset.frac;
    if (dim === 'width') {
      cp.widthFrac = frac;
      cp.width = resolveInches(cp.widthWhole, cp.widthFrac);
    } else {
      cp.heightFrac = frac;
      cp.height = resolveInches(cp.heightWhole, cp.heightFrac);
    }
    render();
  });

  // Qty stepper — update span directly to avoid full DOM rebuild flash
  on('qty-dec', 'click', () => {
    const cp = app.draft.currentPane;
    cp.qty = Math.max(1, (cp.qty||1) - 1);
    const el = document.getElementById('qty-val');
    if (el) el.textContent = cp.qty;
    deferredRender();
  });
  on('qty-inc', 'click', () => {
    const cp = app.draft.currentPane;
    cp.qty = Math.min(99, (cp.qty||1) + 1);
    const el = document.getElementById('qty-val');
    if (el) el.textContent = cp.qty;
    deferredRender();
  });

  // Labor hrs stepper — 0.25 hr increments, 0.25–8 hr range
  on('labor-dec', 'click', () => {
    const cp = app.draft.currentPane;
    cp.laborHrs = Math.max(0.25, Math.round(((cp.laborHrs||1.0) - 0.25) * 100) / 100);
    const el = document.getElementById('labor-val');
    if (el) el.textContent = cp.laborHrs.toFixed(2) + ' hr';
    deferredRender();
  });
  on('labor-inc', 'click', () => {
    const cp = app.draft.currentPane;
    cp.laborHrs = Math.min(8.0, Math.round(((cp.laborHrs||1.0) + 0.25) * 100) / 100);
    const el = document.getElementById('labor-val');
    if (el) el.textContent = cp.laborHrs.toFixed(2) + ' hr';
    deferredRender();
  });


  // Glass spec chips
  delegate('[data-thickness]',   'click', e => { app.draft.currentPane.thickness  = e.currentTarget.dataset.thickness;  render(); });
  delegate('[data-coating]',     'click', e => { app.draft.currentPane.coating    = e.currentTarget.dataset.coating;    render(); });
  delegate('[data-finish]',      'click', e => { app.draft.currentPane.finish     = e.currentTarget.dataset.finish;     render(); });
  delegate('[data-shape]',       'click', e => { app.draft.currentPane.shape      = e.currentTarget.dataset.shape;      render(); });
  delegate('[data-grid]',        'click', e => { app.draft.currentPane.grid       = e.currentTarget.dataset.grid;       render(); });
  delegate('[data-story-level]', 'click', e => { app.draft.currentPane.storyLevel = e.currentTarget.dataset.storyLevel; render(); });
  delegate('[data-unit-type]',   'click', e => {
    const ut = e.currentTarget.dataset.unitType;
    app.draft.currentPane.unitType = ut;
    // Reset coating if switching to single_pane and current coating isn't valid for SP
    const spCoatings = ['clear','tint','hardcoat','obscured','grey','other'];
    if (ut === 'single_pane' && !spCoatings.includes(app.draft.currentPane.coating)) {
      app.draft.currentPane.coating = 'clear';
    }
    render();
  });

  // Admin settings — write to Supabase, update appConfig in memory
  delegate('[data-admin-supplier]', 'click', async e => {
    await saveConfig({ default_supplier: e.currentTarget.dataset.adminSupplier });
    render();
  });
  delegate('[data-admin-band]', 'click', async e => {
    await saveConfig({ range_band: parseFloat(e.currentTarget.dataset.adminBand) });
    render();
  });
  delegate('[data-admin-round]', 'click', async e => {
    await saveConfig({ round_increment: parseInt(e.currentTarget.dataset.adminRound) });
    render();
  });
  on('admin-min-job-cost', 'change', async e => {
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= 0) { await saveConfig({ min_job_cost: v }); render(); }
  });
  // ---- BRANDING ----
  on('brand-name-save', 'click', async () => {
    const val = document.getElementById('brand-name-input')?.value.trim() || 'FastGlass';
    await saveConfig({ brand_name: val });
    render();
  });

  // Color picker and hex input stay in sync live; Apply button commits
  on('brand-color-picker', 'input', e => {
    const hex = e.target.value;
    const hexInput = document.getElementById('brand-color-hex');
    const preview  = document.getElementById('brand-color-preview');
    if (hexInput) hexInput.value = hex;
    if (preview)  preview.style.background = hex;

  on('brand-color-hex', 'input', e => {
    const hex = e.target.value;
    if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
      const picker  = document.getElementById('brand-color-picker');
      const preview = document.getElementById('brand-color-preview');
      if (picker)  picker.value = hex;
      if (preview) preview.style.background = hex;
    }
  });
  on('brand-color-save', 'click', async () => {
    const hex = document.getElementById('brand-color-hex')?.value.trim();
    if (!/^#[0-9a-fA-F]{6}$/.test(hex)) { alert('Enter a valid hex color, e.g. #F59E0B'); return; }
    await saveConfig({ brand_color: hex });
    applyBranding();
    render();

  on('brand-color-reset', 'click', async () => {
    await saveConfig({ brand_color: null });
    applyBranding();
    render();

  // Logo uploads — Supabase Storage → public URL → app_config
  on('brand-logo-sq-upload', 'change', async e => {

    const { error } = await sb.storage.from('brand-assets').upload(`logos/square.${ext}`, file, { upsert: true });
    if (error) { alert('Upload failed: ' + error.message); return; }
    const { data: { publicUrl } } = sb.storage.from('brand-assets').getPublicUrl(`logos/square.${ext}`);
    await saveConfig({ brand_logo_square_url: publicUrl });

    render();
  });

  on('tier-save-btn', 'click', async () => {
    const cards = document.querySelectorAll('[data-tier-id]');
    const tiers = [];
    for (const card of cards) {
      const id = parseInt(card.dataset.tierId);
      const name = card.querySelector(`[data-tier-name="${id}"]`)?.value.trim();
      const maxCostRaw = card.querySelector(`[data-tier-maxcost="${id}"]`)?.value.trim();
      const multRaw = card.querySelector(`[data-tier-mult="${id}"]`)?.value.trim();
      if (!name) { alert('Each tier must have a name.'); return; }
      const multiplier = parseFloat(multRaw);
      if (isNaN(multiplier) || multiplier <= 0) { alert('Each tier must have a valid multiplier greater than 0.'); return; }
      const maxCost = maxCostRaw === '' ? null : parseFloat(maxCostRaw);
      tiers.push({ id, name, maxCost, multiplier: +multiplier.toFixed(4) });
    }
    if (tiers.filter(t => t.maxCost === null).length > 1) {
      alert('Only one tier can be uncapped ("and above") — give the others a max glass cost.');
      return;
    }
    tiers.sort((a, b) => {
      if (a.maxCost === null) return 1;
      if (b.maxCost === null) return -1;
      return a.maxCost - b.maxCost;
    });
    tiers[tiers.length - 1].maxCost = null; // last tier always has no upper limit
    app.draftTiers = tiers;
    await saveConfig({ markup_tiers: tiers });
    render();
  });

  // ---- PRICE CATALOG (Glass Types / Labor / Materials editors) ----
  delegate('[data-catalog-supplier]', 'click', e => {
    app.catalogSupplier = e.currentTarget.dataset.catalogSupplier;
    render();
  });

  // Every catalog field writes straight into app.draftCatalog on each keystroke.
  // No render() here — rebuilding the DOM mid-keystroke would steal focus (the
  // same bug fixed for search inputs earlier); the next natural render (chip
  // switch, tab switch, Save) picks up whatever's in the draft.
  delegate(
    '[data-catalog-rate-key],[data-catalog-loose-key],[data-catalog-markup],[data-catalog-grid],[data-catalog-labor],[data-catalog-shape],[data-catalog-weight-unit],[data-catalog-threshold]',
    'input',
    e => {
      const cat = getDraftCatalog();
      const el  = e.currentTarget;
      const raw = el.value.trim();
      const supplierId = app.catalogSupplier;
      if (el.dataset.catalogRateKey) {
        const t = el.dataset.catalogRateThickness;
        cat.rates[supplierId][t][el.dataset.catalogRateKey] = raw === '' ? null : parseFloat(raw);
      } else if (el.dataset.catalogLooseKey) {
        const t = el.dataset.catalogLooseThickness;
        cat.looseLiteRates[supplierId][t][el.dataset.catalogLooseKey] = raw === '' ? null : parseFloat(raw);
      } else if (el.dataset.catalogMarkup !== undefined) {
        const v = parseFloat(raw);
        if (!isNaN(v) && v > 0) cat.suppliers[supplierId].markup = v;
      } else if (el.dataset.catalogGrid !== undefined) {
        const v = parseFloat(raw);
        if (!isNaN(v) && v >= 0) cat.suppliers[supplierId].gridAdder = v;
      } else if (el.dataset.catalogLabor) {
        const v = parseFloat(raw);
        if (!isNaN(v) && v > 0) cat.laborRates[el.dataset.catalogLabor] = v;
      } else if (el.dataset.catalogShape) {
        const v = parseFloat(raw);
        if (!isNaN(v) && v > 0) cat.shapeMultipliers[el.dataset.catalogShape] = v;
      } else if (el.dataset.catalogWeightUnit) {
        const v = parseFloat(raw);
        if (!isNaN(v) && v >= 0) cat.glassWeights[el.dataset.catalogWeightUnit][el.dataset.catalogWeightThickness] = v;
      } else if (el.dataset.catalogThreshold) {
        const v = parseFloat(raw);
        if (!isNaN(v) && v > 0) cat.weightThresholds[el.dataset.catalogThreshold] = v;
      }
    }
  );

  on('catalog-save-btn', 'click', async () => {
    const cat = getDraftCatalog();
    await saveConfig({ price_catalog: cat });
    app.draftCatalog = null;
    render();
  });
  on('catalog-cancel-btn', 'click', () => {
    app.draftCatalog = null;
    render();
  });

  // Returns true if currentPane has unsaved changes vs the stored pane at editingPaneIdx
  const hasUnsavedPaneChanges = () => {
    const d = app.draft;
    if (d.editingPaneIdx === null || d.editingPaneIdx === undefined) return false;
    const stored = d.panes[d.editingPaneIdx];
    const cp = d.currentPane;
    const keys = ['thickness','coating','finish','grid','shape','location','qty','width','height','widthWhole','widthFrac','heightWhole','heightFrac','laborHrs','storyLevel','unitType'];
    return keys.some(k => String(cp[k]) !== String(stored[k]));
  };

  // If currentPane has unsaved edits, prompt the user.
  // Returns true (proceed with switch) or false (stay on current pane).
  const confirmPaneSwitch = () => {
    if (!hasUnsavedPaneChanges()) return true;
    const save = confirm('You have unsaved changes to this item.\n\nTap OK to save and switch, or Cancel to stay.');
    if (save) {
      const d = app.draft;
      d.panes[d.editingPaneIdx] = { id: d.panes[d.editingPaneIdx].id, ...d.currentPane };
    }
    return save; // false = stay on current pane, caller must bail
  };

  // Pane tab — switch to new
  on('pane-tab-new', 'click', () => {
    if (!confirmPaneSwitch()) return; // user chose to stay
    const d = app.draft;
    d.editingPaneIdx = null;
    d.currentPane = freshPane(d.currentPane);
    render();
  });

  // Pane tab — edit existing
  delegate('[data-edit-pane-idx]', 'click', e => {
    const d = app.draft;
    const idx = parseInt(e.currentTarget.dataset.editPaneIdx);
    if (idx === d.editingPaneIdx) return; // already on this pane
    if (!confirmPaneSwitch()) return; // user chose to stay
    d.editingPaneIdx = idx;
    d.currentPane = JSON.parse(JSON.stringify(d.panes[idx]));
    render();
  });

  // Add pane / Update pane
  on('add-pane-btn', 'click', () => {
    const d  = app.draft;
    const cp = d.currentPane;
    const isEditing = d.editingPaneIdx !== null && d.editingPaneIdx !== undefined;

    if (isEditing) {
      d.panes[d.editingPaneIdx] = { id: d.panes[d.editingPaneIdx].id, ...cp };
      d.editingPaneIdx = null;
      d.currentPane = freshPane();
    } else {
      if (d.panes.length >= 20) { alert('Maximum 20 panes per quote.'); return; }
      d.panes.push({ id: genPaneId(), ...cp });
      d.currentPane = freshPane(cp);
    }

    if (d.isAdminEdit) {
      // Recalculate totals and sync, then return to quote detail — covers
      // both adding a genuinely new pane and editing an existing one.
      const jobCalc = calcJob(d.panes, d.supplier, { rounded: d.status !== 'draft' });
      d.totalProduct   = jobCalc.totalProduct;
      d.totalLabor     = jobCalc.totalLabor;
      d.totalMaterials = jobCalc.totalMaterials;
      d.grandTotal     = jobCalc.grandTotal;
      appData.quotes = appData.quotes.map(q => q.id === d.id ? { ...d } : q);
      saveState(appData);
      syncQuoteToSupabase(d, d.panes);
      navigate('quote-detail');
      return;
    }

    autosaveDraft(d);
    render();
  });

  // Review quote (from step 1) — auto-add current pane if complete
  on('review-quote-btn', 'click', () => {
    const d  = app.draft;
    const cp = d.currentPane;
    const isEditing = d.editingPaneIdx !== null && d.editingPaneIdx !== undefined;
    if (!isEditing && cp.thickness && cp.coating && cp.finish &&
        cp.width > 0 && cp.height > 0) {
      const r = draftCurrentPaneCalc();
      if (r && !r.requiresQuote) {
        d.panes.push({ id: genPaneId(), ...cp });
        d.currentPane = freshPane(cp);
        d.editingPaneIdx = null;
        autosaveDraft(d);
      }
    }
    if (d.panes.length === 0) return;
    d.step = 2;
    navigate('new-quote');
  });

  // Flag for office review
  on('flag-large-pane', 'click', () => {
    const finalQuote = finalizeDraft('flagged');
    navigate('sent', { quoteId: finalQuote.id });
  });

  // ---- STEP 2 ----
  on('back-step1', 'click', () => {
    app.draft.step = 1;
    navigate('new-quote');
  });
  on('add-another-pane-btn', 'click', () => {
    app.draft.editingPaneIdx = null;
    app.draft.currentPane = freshPane(app.draft.currentPane);
    app.draft.step = 1;
    navigate('new-quote');
  });
  on('proceed-to-review', 'click', () => {
    app.draft.step = 3;
    navigate('review');
  });
  delegate('[data-remove-pane]', 'click', e => {
    const pid = e.currentTarget.dataset.removePane;
    const d = app.draft;
    d.panes = d.panes.filter(p => p.id !== pid);
    if (d.editingPaneIdx !== null) d.editingPaneIdx = null;
    if (d.panes.length === 0) {
      deleteDraftIfEmpty(d.id);
      d.step = 1;
      navigate('new-quote');
    } else {
      autosaveDraft(d);
      render();
    }
  });

  // ---- REVIEW ----
  on('back-to-pane-list', 'click', () => {
    app.draft.step = 2;
    navigate('new-quote');
  });
  on('back-to-admin-log', 'click', () => {
    app.draft = null;
    app.activeTab = 4;
    navigate('admin');
  });
  on('back-home-from-detail', 'click', () => {
    app.draft = null;
    navigate('home');
  });
  on('back-to-quote-detail', 'click', () => {
    app.draft.editingPaneIdx = null;
    app.draft.currentPane = freshPane();
    navigate('quote-detail');
  });
  onSearchInput('home-search', v => { app.homeSearch = v; });
  delegate('[data-admin-edit-pane]', 'click', e => {
    const idx = parseInt(e.currentTarget.dataset.adminEditPane);
    const d = app.draft;
    d.editingPaneIdx = idx;
    d.currentPane = JSON.parse(JSON.stringify(d.panes[idx]));
    d.step = 1;
    navigate('new-quote');
  });

  on('quote-detail-add-pane', 'click', () => {
    const d = app.draft;
    d.editingPaneIdx = null;
    d.currentPane = freshPane();
    d.step = 1;
    navigate('new-quote');
  });

  delegate('[data-admin-remove-pane]', 'click', e => {
    const idx = parseInt(e.currentTarget.dataset.adminRemovePane);
    const d = app.draft;
    if (d.panes.length <= 1) return; // a quote needs at least one pane
    if (!confirm('Remove this item from the quote?')) return;
    d.panes.splice(idx, 1);
    const jobCalc = calcJob(d.panes, d.supplier, { rounded: d.status !== 'draft' });
    d.totalProduct   = jobCalc.totalProduct;
    d.totalLabor     = jobCalc.totalLabor;
    d.totalMaterials = jobCalc.totalMaterials;
    d.grandTotal     = jobCalc.grandTotal;
    appData.quotes = appData.quotes.map(q => q.id === d.id ? { ...d } : q);
    saveState(appData);
    syncQuoteToSupabase(d, d.panes);
    render();
  });

  // Step 2 pane list edit button
  delegate('[data-edit-pane-step2]', 'click', e => {
    const idx = parseInt(e.currentTarget.dataset.editPaneStep2);
    const d = app.draft;
    d.editingPaneIdx = idx;
    d.currentPane = JSON.parse(JSON.stringify(d.panes[idx]));
    d.step = 1;
    render();
  });

  // Persistent header nav.
  // A draft is autosaved the moment it has its first pane, so once
  // panes.length > 0 there's nothing left to lose by navigating away — it's
  // already resumable from Job Log. Only a customer name typed with zero
  // panes yet is genuinely still at risk, since autosave hasn't kicked in.
  const hasUnsavedRisk = () =>
    app.draft && !app.draft.isAdminEdit && app.draft.panes?.length === 0 && !!app.draft.customerName;

  delegate('[data-nav-new-quote]', 'click', () => {
    if (hasUnsavedRisk() && !confirm('Discard this quote? Nothing has been saved yet.')) return;
    app.draft = newDraft();
    navigate('new-quote');
  });
  delegate('[data-nav-home]', 'click', () => {
    if (hasUnsavedRisk() && !confirm('Discard this quote? Nothing has been saved yet.')) return;
    app.draft = null;
    navigate('home');
  });
  delegate('[data-nav-history]', 'click', () => {
    if (hasUnsavedRisk() && !confirm('Discard this quote? Nothing has been saved yet.')) return;
    if (!app.draft?.isAdminEdit) app.draft = null;
    navigate('history');
  });
  delegate('[data-nav-admin]', 'click', () => {
    navigate('admin');
  });

  // Tech save from quote-detail
  on('tech-save-detail', 'click', () => saveAdminEdit());

  on('review-tools', 'input', e => { if (app.draft) app.draft.toolsRequired = e.target.value; });
  on('review-notes', 'input', e => { if (app.draft) app.draft.notes = e.target.value; });

  on('show-customer-btn', 'click', () => openCustomerViewOrGate());

  on('send-quote-btn', 'click', () => {
    app.sendModal = true;
    render();
  });

  on('flag-review-btn', 'click', () => {
    const finalQuote = finalizeDraft('flagged');
    navigate('sent', { quoteId: finalQuote.id });
  });

  // Send modal
  on('send-modal-overlay', 'click', e => {
    if (e.target.id === 'send-modal-overlay') { app.sendModal = false; render(); }
  });
  on('close-send-modal', 'click', () => { app.sendModal = false; render(); });
  on('send-sms-btn', 'click', () => completeSendAction('sent'));
  on('show-screen-btn', 'click', () => {
    // Show presentation first, then save as 'shown' when closed
    app.pendingSaveAsShown = true;
    app.sendModal = false;
    openCustomerViewOrGate();
  });
  on('send-with-contact-btn', 'click', () => {
    const contact = document.getElementById('modal-contact')?.value;
    const type = document.getElementById('modal-contact-type')?.value;
    if (!contact) { alert('Please enter a contact to send to.'); return; }
    app.draft.customerContact = contact;
    app.draft.contactType = type;
    completeSendAction('sent');
  });

  // ---- PRESENTATION PRICE ----
  on('present-price-back', 'click', () => {
    navigate(app.draft?.isAdminEdit ? 'quote-detail' : 'review');
  });
  on('present-price-dec', 'click', () => {
    const d = app.draft;
    const jobCalc = calcJob(d.panes, d.supplier, { rounded: true });
    const inc = appConfig.round_increment || 25;
    const incLow = roundToIncrement(rangeBounds(jobCalc.grandTotal).low, inc);
    d.pendingPresentPrice = Math.max(incLow, (d.pendingPresentPrice ?? incLow) - inc);
    render();
  });
  on('present-price-inc', 'click', () => {
    const d = app.draft;
    const jobCalc = calcJob(d.panes, d.supplier, { rounded: true });
    const inc = appConfig.round_increment || 25;
    const incHigh = roundToIncrement(rangeBounds(jobCalc.grandTotal).high, inc);
    d.pendingPresentPrice = Math.min(incHigh, (d.pendingPresentPrice ?? incHigh) + inc);
    render();
  });
  delegate('[data-present-price]', 'click', e => {
    app.draft.pendingPresentPrice = parseFloat(e.currentTarget.dataset.presentPrice);
    render();
  });
  on('present-price-continue', 'click', () => {
    const d = app.draft;
    d.agreedPrice = d.pendingPresentPrice;
    delete d.pendingPresentPrice;
    if (d.isAdminEdit) {
      const jobCalc = calcJob(d.panes, d.supplier, { rounded: d.status !== 'draft' });
      d.totalProduct   = jobCalc.totalProduct;
      d.totalLabor     = jobCalc.totalLabor;
      d.totalMaterials = jobCalc.totalMaterials;
      d.grandTotal     = jobCalc.grandTotal;
      appData.quotes = appData.quotes.map(q => q.id === d.id ? { ...d } : q);
      saveState(appData);
      syncQuoteToSupabase(d, d.panes);
    } else {
      autosaveDraft(d);
    }
    // The customer-view overlay renders on top of whatever app.route is
    // underneath — closing it falls back to that route. Restore it to
    // where Continue was reached from (present-price isn't a real
    // destination to land back on), same as the back button does.
    app.route = d.isAdminEdit ? 'quote-detail' : 'review';
    openCustomerViewOrGate();
  });

  // Admin edit actions
  on('admin-edit-save', 'click', () => saveAdminEdit());
  on('admin-delete-btn', 'click', () => {
    if (app.draft?.isAdminEdit) deleteAdminQuote(app.draft.id);
  });
  on('admin-revert-approved', 'click', () => revertApprovedQuote());
  delegate('[data-admin-status]', 'click', e => {
    if (app.draft?.isAdminEdit) {
      app.draft.status = e.currentTarget.dataset.adminStatus;
      render();
    }
  });
  delegate('[data-admin-edit-quote]', 'click', e => {
    openAdminQuote(e.currentTarget.dataset.adminEditQuote);
  });
  delegate('[data-admin-delete-quote]', 'click', e => {
    deleteAdminQuote(e.currentTarget.dataset.adminDeleteQuote);
  });

  // ---- SENT ----
  on('start-new-quote-from-sent', 'click', () => {
    app.draft = newDraft();
    navigate('new-quote');
  });
  on('view-history-btn', 'click', () => navigate('history'));

  // ---- HISTORY ----
  on('back-home-from-history', 'click', () => navigate('home'));
  onSearchInput('history-search', v => { app.historySearch = v; });

  // ---- ADMIN ----
  on('back-home-admin', 'click', () => navigate('home'));
  onSearchInput('admin-quote-search', v => { app.adminQuoteSearch = v; });
  delegate('[data-tab]', 'click', e => {
    app.activeTab = parseInt(e.currentTarget.dataset.tab);
    app.editMode = null;
    if (app.activeTab === 5 && !app.adminUsersList && !app.adminUsersLoading) {
      loadAdminUsers();
    }
    render();
  });

  // ---- ADMIN: USERS ----
  on('admin-users-refresh', 'click', () => loadAdminUsers());
  on('admin-users-retry', 'click', () => loadAdminUsers());
  on('admin-users-add-toggle', 'click', () => {
    app.adminAddUserOpen = !app.adminAddUserOpen;
    if (app.adminAddUserOpen) app.addUserForm = { name: '', email: '', role: 'tech' };
    render();
  });
  // No render() on these — nothing else on screen reacts live to this
  // form's fields, so there's nothing to gain from re-rendering (and every
  // reason not to, since that's exactly what breaks focus on other inputs).
  on('add-user-name', 'input', e => {
    app.addUserForm = app.addUserForm || { name: '', email: '', role: 'tech' };
    app.addUserForm.name = e.target.value;
  });
  on('add-user-email', 'input', e => {
    app.addUserForm = app.addUserForm || { name: '', email: '', role: 'tech' };
    app.addUserForm.email = e.target.value;
  });
  delegate('[data-add-user-role]', 'click', e => {
    app.addUserForm = app.addUserForm || { name: '', email: '', role: 'tech' };
    app.addUserForm.role = e.currentTarget.dataset.addUserRole;
    render();
  });
  on('add-user-submit', 'click', async () => {
    const form = app.addUserForm || {};
    if (!form.name || !form.email) {
      const errEl = document.getElementById('add-user-error');
      if (errEl) errEl.textContent = 'Name and email are required.';
      return;
    }
    app.addUserSubmitting = true;
    render();
    try {
      const redirectTo = window.location.origin + window.location.pathname;
      const result = await callAdminUserAction('invite', {
        email: form.email, name: form.name, role: form.role || 'tech', redirectTo,
      });
      app.adminAddUserOpen = false;
      app.addUserForm = null;
      app.addUserSubmitting = false;
      if (result.error) alert(`User created, but: ${result.error}`);
      await loadAdminUsers();
    } catch (err) {
      app.addUserSubmitting = false;
      render();
      const errEl = document.getElementById('add-user-error');
      if (errEl) errEl.textContent = err.message;
    }
  });
  delegate('[data-user-toggle-active]', 'click', async e => {
    const id = e.currentTarget.dataset.userToggleActive;
    const isActive = e.currentTarget.dataset.active === 'true';
    if (id === app.currentUser.id) { alert("You can't deactivate your own account."); return; }
    if (isActive && !confirm('Deactivate this user? They will not be able to log in.')) return;
    const { error } = await sb.from('profiles').update({ is_active: !isActive }).eq('id', id);
    if (error) { alert('Failed to update: ' + error.message); return; }
    const u = app.adminUsersList?.find(x => x.id === id);
    if (u) u.isActive = !isActive;
    render();
  });
  delegate('[data-user-reset]', 'click', async e => {
    const email = e.currentTarget.dataset.email;
    if (!confirm(`Send a password reset email to ${email}?`)) return;
    const redirectTo = window.location.origin + window.location.pathname;
    await sb.auth.resetPasswordForEmail(email, { redirectTo });
    alert(`Reset email sent to ${email}.`);
  });
  delegate('[data-user-delete]', 'click', async e => {
    const id = e.currentTarget.dataset.userDelete;
    const email = e.currentTarget.dataset.email;
    if (id === app.currentUser.id) { alert("You can't delete your own account."); return; }
    if (!confirm(`Permanently delete ${email}? This cannot be undone.`)) return;
    try {
      await callAdminUserAction('delete', { userId: id });
      app.adminUsersList = (app.adminUsersList || []).filter(x => x.id !== id);
      render();
    } catch (err) {
      alert('Could not delete: ' + err.message);
    }
  });

}

/* ================================================================
   AUTH
================================================================ */
// Sets the login error via app state (not a direct DOM write) since a
// sign-out mid-flow (deactivated account) triggers the global SIGNED_OUT
// listener's navigate('login'), which re-renders the screen from scratch
// and would silently wipe out any text written directly into the DOM.
function setLoginError(msg) {
  app.loginError = msg;
  const errEl = document.getElementById('login-error');
  if (errEl) errEl.textContent = msg; // best-effort immediate paint
  const btn = document.getElementById('login-btn');
  if (btn) { btn.disabled = false; btn.textContent = 'Sign In →'; }
}

async function handleLogin() {
  const email    = document.getElementById('login-user')?.value.trim();
  const password = document.getElementById('login-pass')?.value;
  const btn      = document.getElementById('login-btn');

  if (!email || !password) {
    setLoginError('Please enter your email and password.');
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
  app.loginError = '';
  const errElClear = document.getElementById('login-error');
  if (errElClear) errElClear.textContent = '';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    setLoginError('Invalid email or password.');
    return;
  }

  const { data: profile } = await sb
    .from('profiles')
    .select('name, role, is_active')
    .eq('id', data.user.id)
    .single();

  // A deactivated account still has valid credentials — signInWithPassword
  // succeeds before we can catch this, so it needs its own message and an
  // explicit sign-out rather than looking like a generic login failure.
  if (profile && profile.is_active === false) {
    await sb.auth.signOut();
    setLoginError('This account has been deactivated. Contact your admin.');
    return;
  }

  app.currentUser = {
    id:   data.user.id,
    name: profile?.name || data.user.email,
    role: profile?.role || 'tech',
  };

  await loadConfig();
  applyBranding();
  await flushPendingSync();
  await loadQuotes();
  navigate('home');
}

/* ================================================================
   AUTOSAVE — persist an in-progress (pre-send) draft as it's built
================================================================ */
// Fires after the first pane is added and on every pane add/edit/remove
// after that, so a tech can resume from Job Log if the app closes before
// they reach Send. Only for a fresh draft (never isAdminEdit — a reopened
// quote already has its own sync-on-edit path). Status stays 'draft' and
// the job total is left unrounded, same as every other estimating screen.
function autosaveDraft(d) {
  if (!d || d.isAdminEdit) return;
  const jobCalc = calcJob(d.panes, d.supplier);
  const existing = appData.quotes.find(q => q.id === d.id);
  const quote = {
    id:              d.id,
    techId:          app.currentUser.id,
    techName:        app.currentUser.name,
    customerName:    d.customerName,
    customerContact: d.customerContact,
    contactType:     d.contactType,
    jobDate:         d.jobDate,
    jobNum:          d.jobNum || '',
    notes:           d.notes || '',
    toolsRequired:   d.toolsRequired || '',
    status:          'draft',
    supplier:        d.supplier,
    panes:           d.panes,
    totalProduct:    jobCalc.totalProduct,
    totalLabor:      jobCalc.totalLabor,
    totalMaterials:  jobCalc.totalMaterials,
    grandTotal:      jobCalc.grandTotal,
    agreedPrice:     d.agreedPrice ?? null,
    customerApproved: !!d.customerApproved,
    approvedAt:      d.approvedAt || null,
    signatureUrl:    d.signatureUrl || null,
    catalogVersion:  d.catalogVersion,
    createdAt:       existing?.createdAt || new Date().toISOString(),
    syncedAt:        app.isOnline ? new Date().toISOString() : null,
  };
  appData.quotes = appData.quotes.filter(q => q.id !== quote.id);
  appData.quotes.unshift(quote);
  saveState(appData);
  syncQuoteToSupabase(quote, quote.panes);
}

// A draft that's been edited back down to zero panes has nothing worth
// keeping remotely — clean up both the local record and Supabase rather
// than leave a phantom empty draft sitting in Job Log.
async function deleteDraftIfEmpty(id) {
  if (!appData.quotes.some(q => q.id === id)) return; // never synced, nothing to clean up
  appData.quotes = appData.quotes.filter(q => q.id !== id);
  saveState(appData);
  unqueuePendingSync(id);
  if (app.isOnline) {
    try {
      await sb.from('panes').delete().eq('quote_id', id);
      await sb.from('quotes').delete().eq('id', id);
    } catch (e) { console.warn('Failed to clean up empty draft', e); }
  }
}

/* ================================================================
   FINALIZE DRAFT → SAVE QUOTE
================================================================ */
function finalizeDraft(status, signatureDataUrl) {
  const d = app.draft;
  const jobCalc = calcJob(d.panes, d.supplier, { rounded: true });
  const quote = {
    id:              d.id,
    techId:          app.currentUser.id,
    techName:        app.currentUser.name,
    customerName:    d.customerName,
    customerContact: d.customerContact,
    contactType:     d.contactType,
    jobDate:         d.jobDate,
    jobNum:          d.jobNum || '',
    notes:           d.notes || '',
    toolsRequired:   d.toolsRequired || '',
    status:          status,
    supplier:        d.supplier,
    panes:           d.panes,
    totalProduct:    jobCalc.totalProduct,
    totalLabor:      jobCalc.totalLabor,
    totalMaterials:  jobCalc.totalMaterials,
    grandTotal:      jobCalc.grandTotal,
    agreedPrice:     d.agreedPrice ?? null,
    customerApproved: !!d.customerApproved,
    approvedAt:      d.approvedAt || null,
    signatureUrl:    d.signatureUrl || null,
    catalogVersion:  d.catalogVersion,
    createdAt:       new Date().toISOString(),
    syncedAt:        app.isOnline ? new Date().toISOString() : null,
  };

  // Optimistic update — available immediately for renderSent()
  appData.quotes = appData.quotes.filter(q => q.id !== quote.id);
  appData.quotes.unshift(quote);
  app.draft = null;

  // Background sync to Supabase — does not block navigation
  syncQuoteToSupabase(quote, quote.panes, signatureDataUrl);

  return quote;
}

/* ================================================================
   VIEW QUOTE FROM HISTORY (REOPEN)
================================================================ */
function viewQuoteFromHistory(quoteId) {
  const q = appData.quotes.find(x => x.id === quoteId);
  if (!q) return;
  app.draft = {
    id: q.id,
    customerName: q.customerName || '',
    customerContact: q.customerContact || '',
    contactType: q.contactType || 'phone',
    jobDate: q.jobDate,
    jobNum: q.jobNum || '',
    notes: q.notes || '',
    toolsRequired: q.toolsRequired || '',
    supplier: q.supplier || getDefaultSupplier(),
    panes: JSON.parse(JSON.stringify(q.panes)),
    currentPane: freshPane(),
    editingPaneIdx: null,
    step: 3,
    catalogVersion: q.catalogVersion,
    status: q.status,
    createdAt: q.createdAt,
    techId: q.techId,
    techName: q.techName,
    agreedPrice: q.agreedPrice ?? null,
    customerApproved: !!q.customerApproved,
    approvedAt: q.approvedAt || null,
    signatureUrl: q.signatureUrl || null,
    isAdminEdit: true,
  };
  navigate('quote-detail');
}

/* ================================================================
   ADMIN EDIT / DELETE
================================================================ */
// Send/Show/Present from a *reopened* quote (Quote Detail) — deliberately
// separate from finalizeDraft(), which always stamps techId/techName from
// whoever is currently logged in and always resets createdAt. Reusing it
// here would silently reassign ownership to whoever clicks Send, and reset
// the quote's original creation date every time it's re-sent. This keeps
// the original tech and creation date, and only updates status/totals.
// opts.keepDraft: normally this ends the editing session (app.draft = null,
// caller navigates away). The admin "Revert to Sent" action needs the
// opposite — stay right here with editing now unlocked — so it can pass
// keepDraft to update app.draft in place instead.
function updateQuoteStatus(status, opts = {}, signatureDataUrl) {
  const d = app.draft;
  if (!d || !d.isAdminEdit) return null;
  const jobCalc = calcJob(d.panes, d.supplier, { rounded: true });
  const updated = {
    id:              d.id,
    techId:          d.techId,
    techName:        d.techName,
    customerName:    d.customerName,
    customerContact: d.customerContact,
    contactType:     d.contactType,
    jobDate:         d.jobDate,
    jobNum:          d.jobNum || '',
    notes:           d.notes || '',
    toolsRequired:   d.toolsRequired || '',
    status:          status,
    supplier:        d.supplier,
    panes:           d.panes,
    totalProduct:    jobCalc.totalProduct,
    totalLabor:      jobCalc.totalLabor,
    totalMaterials:  jobCalc.totalMaterials,
    grandTotal:      jobCalc.grandTotal,
    agreedPrice:     d.agreedPrice ?? null,
    customerApproved: !!d.customerApproved,
    approvedAt:      d.approvedAt || null,
    signatureUrl:    d.signatureUrl || null,
    catalogVersion:  d.catalogVersion,
    createdAt:       d.createdAt,
    syncedAt:        app.isOnline ? new Date().toISOString() : null,
  };
  appData.quotes = appData.quotes.map(q => q.id === updated.id ? updated : q);
  saveState(appData);
  if (opts.keepDraft) {
    Object.assign(d, updated);
  } else {
    app.draft = null;
  }
  syncQuoteToSupabase(updated, updated.panes, signatureDataUrl);
  return updated;
}

// Shared by every Send/Show-on-screen completion point (SMS/email send,
// manual-contact send, and signature capture). Routes to finalizeDraft
// (fresh quote → Sent confirmation screen) or updateQuoteStatus (reopened
// quote → back to Home, matching Save's existing navigation) depending on
// how we got here.
function completeSendAction(status, signatureDataUrl) {
  const isReopen = !!app.draft?.isAdminEdit;
  const finalQuote = isReopen
    ? updateQuoteStatus(status, {}, signatureDataUrl)
    : finalizeDraft(status, signatureDataUrl);
  if (isReopen) navigate('home');
  else navigate('sent', { quoteId: finalQuote.id });
}

// Admin-only escape hatch for an approved (signed) quote that needs a
// correction. Deliberately separate from the normal status chips — reverts
// status to 'sent' and unlocks pane editing, but does NOT clear the
// customer's existing signature/approval fields. That evidence stays on
// the record even though current status is no longer 'approved'.
function revertApprovedQuote() {
  const d = app.draft;
  if (!d || d.status !== 'approved') return;
  if (!confirm('Revert this quote to Sent? This unlocks item editing. The customer\'s existing signature and approval stay on file.')) return;
  updateQuoteStatus('sent', { keepDraft: true });
  render();
}

// Every path to the customer view goes through here first. If a price
// hasn't been picked for this quote yet, route to the picker instead of
// opening the customer view — once picked, it's reused for every future
// view of this same quote, so the picker never appears again after this.
function openCustomerViewOrGate() {
  const d = app.draft;
  if (!d) return;
  if (d.agreedPrice === undefined || d.agreedPrice === null) {
    const jobCalc = calcJob(d.panes, d.supplier, { rounded: true });
    if (jobCalc.lineItems.length < d.panes.length) {
      alert('This quote includes items that need a custom quote. Resolve those before presenting a price to the customer.');
      app.pendingSaveAsShown = false;
      return;
    }
    navigate('present-price');
    return;
  }
  app.customerViewOpen = true;
  app.customerViewQuoteId = '__draft__';
  render();
}

async function saveAdminEdit() {
  const d = app.draft;
  if (!d || !d.isAdminEdit) return;
  const jobCalc = calcJob(d.panes, d.supplier, { rounded: d.status !== 'draft' });
  const updated = {
    ...d,
    totalProduct:   jobCalc.totalProduct,
    totalLabor:     jobCalc.totalLabor,
    totalMaterials: jobCalc.totalMaterials,
    grandTotal:     jobCalc.grandTotal,
  };
  // Update in-memory store
  appData.quotes = appData.quotes.map(q => q.id === updated.id ? updated : q);
  saveState(appData);
  app.draft = null;
  syncQuoteToSupabase(updated, updated.panes); // fire-and-forget
  navigate('home');
}

async function deleteAdminQuote(quoteId) {
  if (!confirm('Permanently delete this quote? This cannot be undone.')) return;
  appData.quotes = appData.quotes.filter(q => q.id !== quoteId);
  saveState(appData);
  app.draft = null;
  if (app.isOnline) {
    await sb.from('panes').delete().eq('quote_id', quoteId);
    await sb.from('quotes').delete().eq('id', quoteId);
  }
  navigate('home');
}

/* ================================================================
   ADMIN USER MANAGEMENT — via the admin-user-actions Edge Function
   (list users w/ email, delete). Deactivate/reactivate and password
   reset are plain client-side calls — see attachEvents handlers.
================================================================ */
async function callAdminUserAction(action, extra = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-user-actions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${session.access_token}`,
      'apikey': SUPABASE_KEY,
    },
    body: JSON.stringify({ action, ...extra }),
  });
  const result = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(result.error || 'Action failed');
  return result;
}

async function loadAdminUsers() {
  if (app.adminUsersLoading) return;
  app.adminUsersLoading = true;
  app.adminUsersError = null;
  render();
  try {
    const result = await callAdminUserAction('list');
    app.adminUsersList = result.users;
  } catch (e) {
    app.adminUsersError = e.message || 'Failed to load users';
  } finally {
    app.adminUsersLoading = false;
    render();
  }
}

/* ================================================================
   ONLINE/OFFLINE DETECTION
================================================================ */
window.addEventListener('online', () => {
  app.isOnline = true;
  appData.lastSync = new Date().toISOString();
  if (app.currentUser) flushPendingSync().then(loadQuotes).then(render);
  else render();
});
window.addEventListener('offline', () => {
  app.isOnline = false;
  render();
});

/* ================================================================
   INIT
================================================================ */
async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const { data: profile } = await sb
        .from('profiles')
        .select('name, role, is_active')
        .eq('id', session.user.id)
        .single();
      if (profile && profile.is_active === false) {
        await sb.auth.signOut();
        app.loginError = 'This account has been deactivated. Contact your admin.';
      } else {
        app.currentUser = {
          id:   session.user.id,
          name: profile?.name || session.user.email,
          role: profile?.role || 'tech',
        };
      }
    }
  } catch (e) {
    console.warn('Session restore failed', e);
  }
  await loadConfig();
  applyBranding();
  if (app.currentUser) {
    await flushPendingSync();
    await loadQuotes();
  }
  render();
}

// Sync auth state across tabs and handle token expiry
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') {
    app.currentUser = null;
    app.draft = null;
    navigate('login');
  } else if (event === 'PASSWORD_RECOVERY') {
    // Fires when the user lands here via the emailed reset link — the SDK
    // has already parsed the URL fragment and established a temporary
    // recovery session, so route straight to the set-new-password screen.
    app.passwordUpdated = false;
    navigate('set-new-password');
  }
});

// Apply saved theme + cached branding before first render to avoid flash
(function() {
  const saved = localStorage.getItem('fg_theme') || 'dark';
  document.documentElement.dataset.theme = saved;
  try {
    const cached = localStorage.getItem('fg_config_cache');
    if (cached) Object.assign(appConfig, JSON.parse(cached));
  } catch {}
  applyBranding();
})();

function toggleTheme() {
  const isLight = document.documentElement.dataset.theme === 'light';
  const next = isLight ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('fg_theme', next);
  render();
}

init();
</script>
